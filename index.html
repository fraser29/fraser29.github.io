<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Landing | Fraser's Research & Software Portfolio</title>
  <meta name="description" content="Landing page for Fraser's public software projects and research profiles.">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/img/favicons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/img/favicons/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="assets/img/favicons/favicon-16x16.png">
  <link rel="icon" href="assets/img/favicons/favicon.ico">
  <link rel="mask-icon" href="assets/img/favicons/safari-pinned-tab.svg" color="#1b2f57">
  <meta name="msapplication-TileImage" content="assets/img/favicons/mstile-150x150.png">
  <meta name="theme-color" content="#b81f3f">
  <link rel="stylesheet" href="assets/site/styles.css">
</head>
<body>
  <main class="container">
    <nav id="site-nav" class="site-nav"></nav>

    <header class="hero">
      <div class="hero-intro">
        <img
          class="profile-pic"
          src="assets/img/favicons/android-chrome-512x512.png"
          alt="Profile picture for Fraser"
        >
        <div class="about-panel">
          <h1 id="page-title"></h1>
          <p id="page-subtitle"></p>
          <h2 id="about-heading"></h2>
          <p id="about-text"></p>
        </div>
      </div>
      <div class="metrics">
        <div class="metric"><b id="metric-projects">0</b>public repos</div>
        <div class="metric"><b id="metric-stars">0</b>total stars</div>
        <div class="metric"><b id="metric-core">0</b>core ecosystem tools</div>
      </div>
    </header>

    <section>
      <h2>Explore by section</h2>
      <div class="cta-grid" id="landing-links"></div>
    </section>

    <section>
      <h2>Medical imaging ecosystem</h2>
      <p>The six-tool stack for ingestion, DICOM handling, processing, orchestration, and interactive annotation.</p>
      <div class="chip-row" id="highlights"></div>
    </section>

    <footer id="site-footer"></footer>
  </main>

  <script type="module" src="assets/site/home.js"></script>
</body>
</html>
